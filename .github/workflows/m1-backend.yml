name: M1 Backend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m1-backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Run M1 candidate gate
        shell: pwsh
        run: ./scripts/m1/verify.ps1

      - name: Run M2.4 build provenance gate
        shell: pwsh
        run: ./scripts/m2/verify-build-provenance.ps1 -RequireGithubSmoke

      - name: Upload M2.4 build provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-build-provenance-${{ github.sha }}
          path: backend/build/m2/build-provenance-smoke.json
          if-no-files-found: error

      - name: Publish M1 failure diagnosis
        if: failure()
        shell: pwsh
        run: |
          $evidence = Get-ChildItem backend/build/m1/evidence -Filter evidence.json -Recurse |
            Select-Object -First 1
          if ($null -eq $evidence) {
            Write-Output "::error title=M1 gate failure::evidence.json was not produced"
            exit 0
          }
          $document = Get-Content -LiteralPath $evidence.FullName -Raw | ConvertFrom-Json
          $message = ($document.failure -replace "`r|`n", " ")
          Write-Output "::error title=M1 gate failure::$message"
          Get-ChildItem backend/build/m1/evidence -Filter "TEST-*.xml" -Recurse |
            ForEach-Object {
              [xml]$report = Get-Content -LiteralPath $_.FullName -Raw
              @($report.testsuite.testcase) | Where-Object { $_.failure -or $_.error } |
                ForEach-Object {
                  $detail = if ($_.failure) { $_.failure.message } else { $_.error.message }
                  $detail = ($detail -replace "`r|`n", " ")
                  Write-Output "::error title=Failed test $($_.classname).$($_.name)::$detail"
                }
              $capturedOutput = [string]$report.testsuite.'system-out' + "`n" + [string]$report.testsuite.'system-err'
              $serverFailure = [regex]::Match(
                $capturedOutput,
                'Unhandled API exception[\s\S]{0,1800}'
              )
              if ($serverFailure.Success) {
                $detail = ($serverFailure.Value -replace "`r|`n", " ")
                Write-Output "::error title=Unhandled API exception::$detail"
              }
            }

      - name: Upload M1 evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: m1-evidence-${{ github.sha }}
          path: backend/build/m1/
          if-no-files-found: error
          retention-days: 30
