spring:
  application:
    name: vsrqg
  profiles:
    default: prod
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${VSRQG_OIDC_ISSUER_URI}
          audiences:
            - ${VSRQG_OIDC_AUDIENCE}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

vsrqg:
  idempotency:
    retention: ${VSRQG_IDEMPOTENCY_RETENTION:PT24H}
